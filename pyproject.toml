[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "firecrawl-py>=4.44.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "mcp>=2.2.0",
    "openai>=3.19.2",
    "openinference-instrumentation-anthropic>=2.1.6",
    "openinference-instrumentation-openai>=0.1.61",
    "openinference-semantic-conventions>=0.1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.1.1",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mikoshi"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
