# Builds a debug APK

name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: cimg/android:2026.10-node
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v7

      - run: npm ci

      - run: npm run android:sync

      - name: Build debug APK
        run: npm run android:debug
        env:
          APK_VERSION_CODE: ${{ github.run_number }}

      # v4+ refuses to run on non-github.com servers; Forgejo runners implement the v3 artifact API
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: mikoshi-debug-apk
          path: webui/android/app/build/outputs/apk/debug/app-debug.apk
